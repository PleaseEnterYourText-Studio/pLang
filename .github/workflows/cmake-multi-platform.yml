# This starter workflow is for a CMake project running on multiple platforms.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++

    steps:
    - uses: actions/checkout@v4
    - name: Install LLVM on Ubuntu
      if: runner.os == 'Linux'
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main"
        sudo apt-get update
        sudo apt-get install -y llvm-22-dev lld-22 libclang-22-dev clang-22
        echo "LLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm" >> $GITHUB_ENV
      shell: bash

    - name: Install LLVM on macOS
      if: runner.os == 'macOS'
      run: |
        brew install llvm
        echo "LLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm" >> $GITHUB_ENV

    - name: Install LLVM on Windows
      if: runner.os == 'Windows'
      run: |
        $version = "20.1.8"
        $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"
        $installer = "$env:TEMP\llvm-installer.exe"
        
        Write-Host "Downloading LLVM $version from $url"
        Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
        
        Write-Host "Installing LLVM silently..."
        Start-Process -Wait -FilePath $installer -ArgumentList "/SILENT /NORESTART /ALLUSERS /DIR=C:\LLVM"
        
        if (Test-Path "C:\LLVM\lib\cmake\llvm") {
          echo "LLVM_DIR=C:/LLVM/lib/cmake/llvm" >> $env:GITHUB_ENV
          Write-Host "LLVM installed successfully at C:\LLVM"
        } else {
          Write-Host "::error::LLVM installation failed!"
          exit 1
        }
      shell: pwsh
    - name: Verify LLVM installation
      run: |
        echo "LLVM_DIR=${{ env.LLVM_DIR }}"
        if [ -d "${{ env.LLVM_DIR }}" ]; then
          echo "LLVM found at ${{ env.LLVM_DIR }}"
        else
          echo "::warning::LLVM_DIR not found at ${{ env.LLVM_DIR }}"
          exit 1
        fi
      shell: bash

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DLLVM_DIR=${{ env.LLVM_DIR }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}
